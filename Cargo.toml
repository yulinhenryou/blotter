[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
cards = { path = "crates/cards" }
solver = { path = "crates/solver" }
pyo3 = "0.30.1"
criterion = "0.8.2"
num-rational = { version = "0.4.2", default-features = false, features = ["std"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
