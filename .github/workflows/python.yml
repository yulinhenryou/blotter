name: Python

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "python/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/export_openapi.py"
      - "web/openapi.json"
      - "scripts/export_hand_record_schema.py"
      - "web/hand-record.schema.json"
      - "scripts/export_rules_corpus.py"
      - "web/src/rules/fixtures/corpus.json"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    # Storage tests run on SQLite and on this PostgreSQL (M3a plan, D2; ADR-0025).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+pg8000://postgres:postgres@localhost:5432/test
      # A missing PostgreSQL fails the run instead of skipping its tests.
      REQUIRE_POSTGRES: "1"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # Builds the native module review._engine with maturin.
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # Includes the check that web/openapi.json matches the API.
      - run: uv run pytest
