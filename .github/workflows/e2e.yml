name: E2E

# End-to-end tests (M4a Task 7): the production web build served with the real API (FastAPI on a
# temporary SQLite database, scripts/e2e_server.py), driven by Playwright in WebKit and Chromium.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "web/**"
      - "python/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "project.json"
      - "scripts/e2e_server.py"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A run takes about 3 minutes when the runner's Ubuntu mirror is fast; on 2026-11-10 it served
    # the browsers' system packages (114 MB) at about 140 kB/s and runs took 14-16 minutes. A hung
    # download should still fail the check rather than run for the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The API imports the native module review._engine, built from the Rust crates.
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: python
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium webkit
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
