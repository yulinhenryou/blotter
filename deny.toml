# cargo-deny configuration. CI runs `cargo deny check licenses` (ADR-0009, ADR-0014).
#
# The project is distributed under MIT OR Apache-2.0, so every dependency must carry a license
# compatible with that. Anything not listed in `allow` is rejected, which keeps copyleft
# licenses (GPL, LGPL, AGPL) out of the dependency tree. Add a license here only after checking
# that it is permissive.

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory: unused entries are fine.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are not published (publish = false); their license is checked by review.
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
